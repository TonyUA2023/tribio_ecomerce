[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[program:apache2]
command=apache2-foreground
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

[program:queue-worker]
; Procesa los jobs en cola (QUEUE_CONNECTION=database en .env) — sin este proceso
; corriendo, los Mailables encolados (p. ej. OrderReceivedCustomer/OrderReceivedStore,
; ver App\Observers\OrderObserver) se quedan para siempre en la tabla `jobs` y jamás
; se envían, sin ningún error visible. autorestart=true lo reinicia si crashea;
; --max-time=3600 lo recicla cada hora para evitar fugas de memoria en un proceso PHP
; de tan larga duración.
command=php /var/www/html/artisan queue:work --tries=3 --backoff=30 --max-time=3600 --sleep=3
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopwaitsecs=30
priority=20
